name: AI Auto Research Bot

on:
  # 毎日、または手動で実行できるように設定
  schedule:
    - cron: '0 0 * * *' # 毎日UTC 0:00（日本時間 朝9:00）に自動実行
  workflow_dispatch: # 手動でもボタン一つで実行可能

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-generativeai

      - name: Run Python script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python auto_research.py

      - name: Commit and push generated report
        run: |
          git config --global user.name "AI Bot"
          git config --global user.email "bot@example.com"
          git add outputs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Add automated AI research report" && git push)